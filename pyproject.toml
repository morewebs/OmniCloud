[project]
name = "omnicloud"
version = "0.5.0"
description = "Open-source, multi-provider cloud control panel (Hetzner, Leaseweb first)."
readme = "README.md"
license = "MIT"
authors = [{ name = "OmniCloud contributors" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "cryptography>=44",
    "mcp>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
